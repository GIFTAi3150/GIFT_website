name: Main PR Source Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  require-dev-source:
    name: Require dev as source branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull request source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$HEAD_REF" != "dev" ]]; then
            echo "::error::Pull requests into main must come from dev. Source branch was: $HEAD_REF"
            exit 1
          fi

          echo "Valid release pull request: dev -> main"
