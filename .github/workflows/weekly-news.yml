name: Weekly News Draft

on:
  schedule:
    # Every Monday 08:30 JST = Sunday 23:30 UTC
    - cron: '30 23 * * 0'
  # Allow manual run from the Actions tab — use this to verify after setup
  workflow_dispatch:

# Notion への書き込みは secrets 経由。GITHUB_TOKEN はリポ読み取りだけで足りる
permissions:
  contents: read

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create weekly news draft in Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/weekly-news.mjs
