version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ['*']
